# distil labs job config for the cases task (docs: reference/config).
# A fixed label set is a question-answering task; the labels live in job_description.json.
base:
  task: question-answering
  student_model_name: Qwen3.5-2B
  teacher_model_name: zai.glm-5.3-low-thinking
evaluation:
  llm_as_a_judge_model_name: zai.glm-5.3-low-thinking
synthgen:
  train_generation_target: 2000
  mutators:
    - name: label
      description: which label the example has
      method: adaptive
      values:
        - "a pair outlier case whose correct label is reverts"
        - "a pair outlier case whose correct label is no_revert"
trace_processing:
  observation_format: openai_messages
